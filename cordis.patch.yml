# Personal speech recognition bundle.
#
# Inserts one Host plugin. It depends on the voice-input bundle already selected in
# the desktop profile, which provides the `speechToText` service this plugin injects.
#
# The wrapped provider is chosen at runtime, so this row works whether the shipped
# provider id changes or the user reorders bundles.
- insert:
    - id: voice-personal
      name: 'dsh-voice-personal'
      config:
        providerId: personal-local
        providerName: 个人语音（本地增强）
        # Empty means: prefer the shipped local provider, then the service default.
        baseProviderId: ''
        # Empty means: <DSH_HOME>/voice-personal
        dataDir: ''
        # Your own glossary, as a JSON file. Empty means <dataDir>/terms.json, which the
        # plugin re-reads whenever it changes — adding a word needs no restart. Kept out of
        # the package on purpose: a `pnpm file:` install is hard-linked, so source edits do
        # not reach the copy DSH loads.
        userTermsFile: ''
        # Empty means: the model shipped beside this plugin.
        speakerModelPath: ''
        voiceprintThreshold: 0.62
        # Off. The goal is higher transcription accuracy, not speaker gating; a fail-closed
        # gate here only blocks dictation when the voiceprint is missing or stale.
        requireEnrolledSpeaker: false
        # Cross-script transliteration (哈里斯 -> Harness). Same-script Chinese homophone
        # rewriting was removed as unsound: see lib/correct/glossary.js.
        crossScript: true
        # There is no fuzzyTerms option. One shipped; an audit measured it inert (6,748
        # single-edit variants, zero extra corrections) and it was removed rather than left
        # as a switch that does nothing. See lib/correct/index.js `fixLatin`.
        canonicalTerms: true
        spacing: space
        applyStyleProfile: true
        # On to receive a per-transcript `changes` audit list.
        audit: false
